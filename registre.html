<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8">
    <title>Joia Justa - Registre</title>
    <link rel="stylesheet" href="css/estils.css">
</head>
<body>

<header>
    <h1>Joia Justa</h1>
    <p>Joieria ètica i sostenible</p>
</header>

<nav>
    <a href="index.html">Inici</a>
    <a href="productes.html">Anells</a>
    <a href="registre.html">Registre</a>
    <a href="login.html">Iniciar sessió</a>
</nav>

<main>
    <h2>Registre</h2>

    <form class="formulari">
        <label for="nom">Nom:</label>
        <input type="text" id="nom" name="nom" required pattern="[A-Za-zÀ-ÿ ]+">

        <label for="email">Correu electrònic:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contrasenya:</label>
        <input type="password" id="password" name="password" required pattern="[A-Za-z0-9]+">

        <label for="adreca">Adreça:</label>
        <input type="text" id="adreca" name="adreca" required maxlength="30">

        <label for="poblacio">Població:</label>
        <input type="text" id="poblacio" name="poblacio" required maxlength="30">

        <label for="cp">Codi postal:</label>
        <input type="text" id="cp" name="cp" required pattern="\d{5}">

        <button type="submit">Registrar-se</button>
    </form>
</main>

<footer>
    <p>Joia Justa 2026 - Pràctica TDIW</p>
</footer>

</body>
</html>
